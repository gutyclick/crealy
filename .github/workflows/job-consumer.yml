name: Crealy job consumer

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crealy-production-job-consumer
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Process queued jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 210 \
            --retry 2 \
            --retry-all-errors \
            -H "x-crealy-cron-secret: $CRON_SECRET" \
            https://www.crealy.app/api/internal/jobs/tick
